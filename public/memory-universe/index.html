<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遇见集 · 记忆图景宇宙模块</title><link rel="stylesheet" href="./styles.css?v=mue9nma6"></head><body><main><section class="stage" aria-label="记忆图景宇宙模块"><div id="scene"></div><button id="add-memory" class="add-memory" type="button">＋ 照片变成记忆</button><div class="memory-progress"><p id="memory-status" role="status" aria-live="polite">正在连接记忆服务…</p><details><summary>生成记录</summary><ul id="memory-jobs"></ul></details></div><div id="loading" class="loading">正在读取记忆模型…</div><button id="return-line" class="return-line" hidden>返回世界线</button><div class="hint">拖动洄游精神图景 · 点击中心地球进入世界线</div></section></main><dialog id="memory-dialog"><form id="memory-form"><div class="memory-dialog-heading"><h2>让照片长成一段记忆</h2><button id="memory-close" type="button" aria-label="关闭">×</button></div><p>选一张主体清晰的照片。模型通常需要几分钟，完成后会自动排列进宇宙。</p><label class="photo-picker">选择照片<input id="memory-photo" type="file" accept="image/jpeg,image/png,image/webp" required><span>JPEG / PNG / WebP · 最大 20 MB</span></label><img id="memory-preview" alt="待生成的照片" hidden><label>记忆名称<input id="memory-name" maxlength="100" placeholder="给这段记忆起个名字"></label><label>照片内容<select id="memory-mode"><option value="object">一件物品 / 一个主体</option><option value="environment">房间 / 整体环境</option></select></label><label id="memory-category-label">主体类别<select id="memory-category"><option value="prop">物品</option><option value="plant">植物</option><option value="creature">动物</option><option value="character">人物</option><option value="furniture">家具</option><option value="building">建筑</option><option value="vehicle">交通工具</option><option value="other">其他</option></select></label><p class="memory-note">将照片发送至建模服务生成 3D；生成会使用服务额度。</p><p id="memory-error" role="alert"></p><button id="memory-submit" type="submit">生成并加入宇宙</button></form></dialog><script type="module" src="./app.bundle.js?v=mue9nma6"></script></body></html>
